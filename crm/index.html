<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MSMExpert CRM</title><style>body{margin:0;background:#f6f8fc;color:#16213b;font:15px system-ui,sans-serif}header{background:#182b57;color:#fff;padding:24px 5%;display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:28px auto;padding:0 20px}.card{background:#fff;border:1px solid #e4e8f0;border-radius:12px;padding:20px;margin:18px 0;box-shadow:0 2px 8px #14213d0a}h1,h2{margin:0 0 8px}small{color:#64748b}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #eef1f6;vertical-align:top}th{font-size:12px;color:#64748b;text-transform:uppercase}a{color:#315bd7}.status{font-weight:700;color:#2457a7}.conversation{white-space:pre-wrap;min-width:280px;max-width:520px;line-height:1.5}.empty{padding:20px;color:#64748b}button{border:0;border-radius:7px;background:#315bd7;color:#fff;padding:9px 13px;cursor:pointer}</style></head><body><header><div><h1>MSMExpert CRM</h1><small style="color:#cbd5e1">Meera call reports and follow-ups</small></div><button onclick="loadReport()">Refresh</button></header><main><section class="card"><h2>Pending follow-ups</h2><div id="callbacks" class="empty">Loading…</div></section><section class="card"><h2>Recent calls</h2><div id="calls" class="empty">Loading…</div></section></main><script>const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function table(rows,columns){if(!rows.length)return '<div class="empty">No live call data yet.</div>';return '<table><thead><tr>'+columns.map(c=>'<th>'+c.label+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+columns.map(c=>'<td>'+c.render(r)+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}async function loadReport(){try{const r=await fetch('/crm/api/report');if(!r.ok)throw new Error();const data=await r.json();document.querySelector('#callbacks').innerHTML=table(data.callbacks,[{label:'Customer',render:r=>escapeHtml(r.phone)},{label:'When',render:r=>new Date(r.scheduled_for).toLocaleString()},{label:'Reason',render:r=>escapeHtml(r.reason)}]);document.querySelector('#calls').innerHTML=table(data.calls,[{label:'Customer',render:r=>escapeHtml(r.phone)},{label:'Status',render:r=>'<span class="status">'+escapeHtml(r.lead_status||r.status)+'</span>'},{label:'Full conversation',render:r=>'<div class="conversation">'+escapeHtml(r.conversation||'No transcript captured.')+'</div>'},{label:'Recording',render:r=>r.recording_url?'<a target="_blank" rel="noopener" href="'+escapeHtml(r.recording_url)+'">Open recording</a>':'—'},{label:'Time',render:r=>r.started_at?new Date(r.started_at).toLocaleString():'—'}]);}catch{document.querySelector('#calls').textContent='Unable to load CRM data.'}}loadReport();</script></body></html>
